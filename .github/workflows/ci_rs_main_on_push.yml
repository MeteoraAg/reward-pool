name: CI

on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop

env:
  SOLANA_CLI_VERSION: 3.1.10
  ANCHOR_CLI_VERSION: 1.0.2
  TOOLCHAIN: 1.93.0

jobs:
  changed_files:
    runs-on: ubuntu-latest
    outputs:
      program: ${{steps.changed-files-specific.outputs.any_changed}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get specific changed files
        id: changed-files-specific
        uses: tj-actions/changed-files@v18.6
        with:
          files: |
            cli
            programs
            tests

  reward_pool_test:
    runs-on: ubuntu-latest
    needs: changed_files
    if: needs.changed_files.outputs.program == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-solana
      - uses: ./.github/actions/setup-dep
      - uses: ./.github/actions/setup-anchor-cli
      # Install rust + toolchain
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: clippy, rustfmt
      # Cache rust, cargo
      - uses: Swatinem/rust-cache@v2
      # Cache node_modules
      - uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: ./node_modules
          key: ${{ runner.os }}-${{ hashFiles('./bun.lock') }}
      # Check code formatting
      - run: cargo fmt -- --check
        shell: bash
      # Testing
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        shell: bash
      - run: cd programs && cargo test -- --nocapture && cd ../..
        shell: bash
      - run: bun run build-local-test
        shell: bash
