[package]
name = "farming"
version = "0.2.2"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "farming"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
verbose = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
ruint = { workspace = true }


[lints]
workspace = true
